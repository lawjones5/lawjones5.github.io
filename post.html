# MHD DNS in Liquid Metal Fusion Breeder Blankets using CHAPsim2

In magnetic confinement fusion reactors (such as Tokamaks), the **breeder blanket** is a core component tasked with:
1. Tritium breeding to sustain the D-T fusion fuel cycle.
2. Efficient thermal energy extraction for electricity generation.
3. Radiation shielding for superconducting magnetic coils.

Liquid metal blankets (e.g., using Lead-Lithium eutectic alloys like PbLi) are a primary candidate design. However, the presence of strong external magnetic fields gives rise to complex **Magnetohydrodynamic (MHD)** flow phenomena.

---

## The Challenge: Hartmann Layers & Turbulence Suppression

When an electrically conducting fluid moves across strong magnetic fields, Lorentz forces are generated (J x B). These forces:
- Create steep velocity gradients in boundary layers (Hartmann layers and side/Shercliff layers).
- Cause high MHD pressure drops that challenge structural engineering and pumping limits.
- Anisotropically damp turbulence, generating quasi-two-dimensional (Q2D) vortices and complex heat transfer modifications.

\`\`\`
       B-field (Toroidal / Poloidal)
              ^
              |
   +-----------------------+  <- Hartmann Layer
   |                       |
   |   Core Flow (Flat)    |  ==> Flow Direction
   |                       |
   +-----------------------+  <- Hartmann Layer
\`\`\`

---

## Computational Methodology with CHAPsim2

To capture these phenomena without reliance on empirical turbulence closures, we employ **CHAPsim2** (Channel and Pipe Simulator 2), a high-fidelity Direct Numerical Simulation (DNS) code specifically adapted for incompressible and low-magnetic Reynolds number MHD flows.

Key simulation features:
- **Numerical Discretization**: High-order finite difference / spectral methods on staggered grids.
- **Poisson Solvers**: Highly scalable parallel solvers for electric potential and pressure.
- **Physical Regimes**: High Hartmann numbers (Ha) and Reynolds numbers (Re), capturing transition to turbulence, instability mechanisms, and thermal convection coupling.

---

## Ongoing Work & Objectives

- Validating velocity profiles and skin friction against experimental measurements from liquid metal test loops.
- Simulating non-isothermal buoyant-MHD mixed convection to characterize hotspot formation.
- Assessing insulating coatings and flow channel inserts (FCIs) to reduce MHD drag.

# Supercritical CO2 (sCO2) Power Cycles for Fusion Energy Systems

Beyond the core plasma and blanket fluid mechanics, converting extracted high-temperature thermal energy into electricity with maximum cycle efficiency is a pivotal engineering challenge for fusion power plants.

While steam Rankine cycles have served traditional nuclear and fossil energy for over a century, **Supercritical Carbon Dioxide (sCO2)** closed-loop Brayton cycles present compelling advantages for future fusion power plants.

---

## Why sCO2 for Fusion Power Plants?

1. **High Thermal Efficiency at Moderate Temperatures**:
   Operating near the critical point of CO2 (31.0°C, 7.38 MPa) drastically reduces compression work due to high fluid density, yielding efficiencies exceeding 45-50% at turbine inlet temperatures between 550°C and 700°C.

2. **Compact Turbomachinery & Plant Footprint**:
   Due to high fluid density throughout the cycle, turbomachinery (turbines, compressors) can be an order of magnitude smaller than comparable steam turbines, saving valuable space in the reactor building.

3. **Compatibility with Liquid Metal Blanket Coolants**:
   Liquid metal systems (such as PbLi or sodium loops) require heat exchangers that avoid violent chemical reactions. sCO2 exhibits significantly reduced chemical reactivity compared to high-pressure water/steam, improving passive safety in intermediate loops.

---

## Areas of Interest

- **Recompression Cycle Layouts**: Investigating split-flow recuperation layouts to optimize thermal match with variable blanket temperature profiles.
- **Dynamic Response & Load Following**: Understanding how the power conversion cycle responds to pulsed or scheduled dwell periods in fusion operations.
- **Printed Circuit Heat Exchangers (PCHEs)**: Evaluating microchannel heat exchanger performance under high pressure and thermal stresses.

# Direct Numerical Simulation of Turbulent Liquid Metal Flow in Rectangular Ducts under Transverse Magnetic Fields

### Authors:
**Lawrence Jones**, Research Group in Fluid Dynamics and Fusion Engineering, University of Sheffield.

---

## Abstract

Liquid metal magnetohydrodynamics (MHD) governs fluid flow and heat transfer inside fusion reactor breeding blankets. In this study, high-fidelity Direct Numerical Simulations (DNS) were carried out using **CHAPsim2** to examine the suppression of turbulent kinetic energy and the development of boundary layers in electrically conducting fluids under uniform magnetic fields.

We examine Hartmann numbers up to Ha = 120 and friction Reynolds numbers Re_tau = 400-800. The numerical solution demonstrates:
- The thinning of Hartmann boundary layers.
- The emergence of characteristic M-shaped velocity profiles in duct cross-sections with conducting side walls.
- Redistribution of Reynolds stress tensors showing near-complete damping of wall-normal velocity fluctuations along the Hartmann walls while quasi-two-dimensional turbulent structures persist parallel to the magnetic field lines.

---

# PhD Progress Update: CHAPsim2 Setup & Computational Scaling at Sheffield

A quick general update on research milestones and ongoing development in our department at the University of Sheffield.

---

## High-Performance Computing Scaling

Recent focus has been on validating parallel scaling of **CHAPsim2** across multi-node MPI architectures. With spatial grid resolutions reaching 1024 x 512 x 512 mesh points for high Hartmann number runs, scaling of the 3D FFT/tridiagonal Poisson solver for electric potential is critical.

Key milestones reached this month:
1. Achieved 88% parallel efficiency across 512 CPU cores on the university cluster.
2. Verified consistency of Hartmann layer resolution using non-uniform Chebyshev and hyperbolic-tangent wall clustering.
3. Established reproducible Python and Julia post-processing workflows for spectral energy budget calculations.

---

## What's Next

- Running production DNS cases for Hartmann number sweeps.
- Preparing poster presentation for upcoming UK fusion technology meetings.
- Refining coupled scalar transport equations for heat flux and tritium inventory calculations.

    // Parse YAML frontmatter
    function parseFrontmatter(rawText) {
      const match = rawText.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/);
      if (!match) {
        return { meta: {}, markdown: rawText };
      }
      const rawMeta = match[1];
      const markdown = match[2];
      const meta = {};
      
      rawMeta.split(/\r?\n/).forEach(line => {
        const colonIdx = line.indexOf(':');
        if (colonIdx !== -1) {
          const key = line.slice(0, colonIdx).trim();
          let val = line.slice(colonIdx + 1).trim();
          // unquote
          if (val.startsWith('"') && val.endsWith('"')) val = val.slice(1, -1);
          if (val.startsWith('[') && val.endsWith(']')) {
            val = val.slice(1, -1).split(',').map(s => s.trim().replace(/^['"]|['"]$/g, ''));
          }
          meta[key] = val;
        }
      });

      return { meta, markdown };
    }

    // Simple markdown fallback in case Marked.js script fails to load
    function simpleMarkdownFallback(text) {
      let html = text
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        .replace(/^\> (.*$)/gim, '<blockquote>$1</blockquote>')
        .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
        .replace(/\*(.*)\*/gim, '<em>$1</em>')
        .replace(/`([^`]+)`/gim, '<code>$1</code>')
        .replace(/\n\n/gim, '<br><br>');
      return html;
    }
