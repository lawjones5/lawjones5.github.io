<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article | Lawrence Jones</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Marked.js for fast client-side markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- KaTeX for math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
</head>
<body>

  <header>
    <div class="container nav-wrapper">
      <a href="index.html" class="brand-title">Lawrence Jones</a>
      <nav>
        <ul>
          <li><a href="index.html">About</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="papers.html">Papers</a></li>
          <li><a href="updates.html">Updates</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <a href="index.html" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Back to Home
    </a>

    <article id="post-container">
      <div id="loading" style="padding: 3rem 0; color: var(--text-muted);">Loading post content...</div>
      
      <div id="post-view" style="display: none;">
        <header class="post-header">
          <div class="post-meta-row">
            <span id="post-category" class="tag teal">Category</span>
            <span id="post-date">Date</span>
            <span id="post-author">Lawrence Jones</span>
          </div>
          <h1 id="post-title" style="margin-top: 0.2rem;"></h1>
          <div id="post-tags" class="tag-group" style="margin-top: 1rem;"></div>
        </header>

        <div id="post-body" class="post-content"></div>
      </div>
    </article>
  </main>

  <footer>
    <div class="container footer-inner">
      <div>&copy; <span id="current-year"></span> Lawrence Jones &bull; University of Sheffield</div>
      <div style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted);">
        PhD Research &bull; Liquid Metal MHD &bull; CHAPsim2
      </div>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
  <script>
    document.getElementById('current-year').textContent = new Date().getFullYear();

    // Parse URL parameter for markdown file
    const urlParams = new URLSearchParams(window.location.search);
    const fileParam = urlParams.get('file');

    // Fallback embedded cache if fetch is blocked or file not found
    const EMBEDDED_POSTS_CACHE = {};

    // Parse YAML frontmatter
    function parseFrontmatter(rawText) {
      const match = rawText.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/);
      if (!match) {
        return { meta: {}, markdown: rawText };
      }
      const rawMeta = match[1];
      const markdown = match[2];
      const meta = {};
      
      rawMeta.split(/\r?\n/).forEach(line => {
        const colonIdx = line.indexOf(':');
        if (colonIdx !== -1) {
          const key = line.slice(0, colonIdx).trim();
          let val = line.slice(colonIdx + 1).trim();
          // unquote
          if (val.startsWith('"') && val.endsWith('"')) val = val.slice(1, -1);
          if (val.startsWith('[') && val.endsWith(']')) {
            val = val.slice(1, -1).split(',').map(s => s.trim().replace(/^['"]|['"]$/g, ''));
          }
          meta[key] = val;
        }
      });

      return { meta, markdown };
    }

    // Simple markdown fallback in case Marked.js script fails to load
    function simpleMarkdownFallback(text) {
      let html = text
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        .replace(/^\> (.*$)/gim, '<blockquote>$1</blockquote>')
        .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
        .replace(/\*(.*)\*/gim, '<em>$1</em>')
        .replace(/`([^`]+)`/gim, '<code>$1</code>')
        .replace(/\n\n/gim, '<br><br>');
      return html;
    }

    // Math is rendered with KaTeX auto-render after the body HTML is set (see below)

    async function loadPost() {
      const loadingEl = document.getElementById('loading');
      const postViewEl = document.getElementById('post-view');

      if (!fileParam) {
        loadingEl.innerHTML = `
          <div class="callout">
            <h3>No article specified</h3>
            <p>Please return to <a href="index.html">the homepage</a> or select an article from <a href="projects.html">Projects</a>, <a href="papers.html">Papers</a>, or <a href="updates.html">Updates</a>.</p>
          </div>
        `;
        return;
      }

      let content = "";
      try {
        const res = await fetch(fileParam);
        if (res.ok) {
          content = await res.text();
        } else {
          content = EMBEDDED_POSTS_CACHE[fileParam];
        }
      } catch (e) {
        content = EMBEDDED_POSTS_CACHE[fileParam];
      }

      if (!content) {
        loadingEl.innerHTML = `
          <div class="callout">
            <h3>Article not found</h3>
            <p>Could not load <code>${fileParam}</code>. Please check that the file exists in the repository.</p>
          </div>
        `;
        return;
      }

      const { meta, markdown } = parseFrontmatter(content);

      // Populate meta fields
      document.title = (meta.title || "Article") + " | Lawrence Jones";
      document.getElementById('post-title').textContent = meta.title || "Untitled Article";
      document.getElementById('post-date').textContent = meta.date || "";
      document.getElementById('post-category').textContent = (meta.category || "Article").toUpperCase();
      if (meta.author) document.getElementById('post-author').textContent = meta.author;

      const tagsContainer = document.getElementById('post-tags');
      tagsContainer.innerHTML = (meta.tags || []).map(tag => `<span class="tag">${tag}</span>`).join(" ");

      // Render body
      const parsedBody = (typeof marked !== 'undefined' && marked.parse) 
        ? marked.parse(markdown) 
        : simpleMarkdownFallback(markdown);

      document.getElementById('post-body').innerHTML = parsedBody;

      // Typeset math ($...$ inline, $$...$$ display) with KaTeX auto-render.
      // Wait for window load: the deferred auto-render script may not have
      // executed yet when a cached fetch resolves instantly.
      if (document.readyState !== 'complete') {
        await new Promise(res => window.addEventListener('load', res, { once: true }));
      }
      if (typeof renderMathInElement === 'function') {
        renderMathInElement(document.getElementById('post-body'), {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false }
          ],
          throwOnError: false
        });
      }

      // Show content
      loadingEl.style.display = 'none';
      postViewEl.style.display = 'block';
    }

    loadPost();
  </script>
</body>
</html>
