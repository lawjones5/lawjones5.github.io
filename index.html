<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My GitHub Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f5f5;
      color: #222;
    }

    .card {
      text-align: center;
      padding: 2rem;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 480px;
      width: calc(100% - 2rem);
    }

    h1 {
      margin-top: 0;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hello, world!</h1>
    <p>Welcome to my personal GitHub Pages site.</p>
  </main>
</body>
</html>
